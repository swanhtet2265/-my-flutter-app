name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        # --stacktrace ကို ထည့်ပေးထားလို့ Error ဖြစ်ရင် အကြောင်းရင်းကို log မှာ ပြပေးလိမ့်မယ်
        run: flutter build apk --release --no-tree-shake-icons --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
